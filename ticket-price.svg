<svg fill="none" viewBox="0 0 900 500" width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">

      <style>
        * {
          box-sizing: border-box;
        }

        .container {
          width: 100%;
          height: 500px;
          padding: 45px;
          border-radius: 25px;

          background: linear-gradient(
            135deg,
            #667eea,
            #764ba2,
            #6dd5ed,
            #2193b0
          );

          background-size: 300% 300%;
          animation: gradient 10s ease infinite;

          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;

          color: white;
        }

        @keyframes gradient {
          0% {
            background-position: 0% 50%;
          }

          50% {
            background-position: 100% 50%;
          }

          100% {
            background-position: 0% 50%;
          }
        }

        .title {
          text-align: center;
          font-size: 38px;
          font-weight: 800;
          margin-bottom: 10px;
        }

        .subtitle {
          text-align: center;
          font-size: 17px;
          opacity: 0.9;
          margin-bottom: 30px;
        }

        .content {
          display: flex;
          gap: 20px;
          justify-content: center;
        }

        .card {
          width: 250px;
          min-height: 270px;
          padding: 25px;

          background: rgba(255, 255, 255, 0.16);
          border: 1px solid rgba(255, 255, 255, 0.3);
          border-radius: 18px;

          backdrop-filter: blur(10px);
        }

        .card h2 {
          margin-top: 0;
          margin-bottom: 15px;
          font-size: 22px;
        }

        .card p {
          font-size: 15px;
          line-height: 1.6;
          margin: 8px 0;
        }

        .price {
          display: flex;
          justify-content: space-between;
          margin: 9px 0;
          font-size: 14px;
        }

        .price span:last-child {
          font-weight: bold;
        }

        .discount {
          margin-top: 18px;
          padding: 10px;
          text-align: center;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.18);
          font-weight: bold;
        }

        .footer {
          text-align: center;
          margin-top: 25px;
          font-size: 14px;
          opacity: 0.85;
        }

        @media (prefers-reduced-motion: reduce) {
          .container {
            animation: none;
          }
        }
      </style>

      <div class="container">

        <div class="title">
          🎟️ Ticket Price Calculator
        </div>

        <div class="subtitle">
          JavaScript Mini Project • Ticket Price Calculator
        </div>

        <div class="content">

          <div class="card">
            <h2>📥 Input</h2>

            <p>• Number of visitors</p>
            <p>• Age of each visitor</p>

            <div class="discount">
              🔢 Using Loop &amp; If/Else
            </div>
          </div>

          <div class="card">
            <h2>⚙️ Process</h2>

            <div class="price">
              <span>&lt; 5 years</span>
              <span>FREE</span>
            </div>

            <div class="price">
              <span>5–12 years</span>
              <span>$5</span>
            </div>

            <div class="price">
              <span>13–59 years</span>
              <span>$10</span>
            </div>

            <div class="price">
              <span>60+ years</span>
              <span>$7</span>
            </div>

            <div class="discount">
              🎉 5+ Tickets → 10% OFF
            </div>
          </div>

          <div class="card">
            <h2>📤 Output</h2>

            <p>• Ticket price per visitor</p>
            <p>• Total tickets</p>
            <p>• Total price</p>
            <p>• Discount</p>
            <p>• Final price</p>

            <div class="discount">
              💰 Final Ticket Price
            </div>
          </div>

        </div>

        <div class="footer">
          Built with JavaScript • Basic Programming Project
        </div>

      </div>

    </div>
  </foreignObject>
</svg>
