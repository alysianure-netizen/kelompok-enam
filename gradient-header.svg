<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea">
        <animate
          attributeName="stop-color"
          values="#667eea;#764ba2;#6dd5ed;#667eea"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#764ba2">
        <animate
          attributeName="stop-color"
          values="#764ba2;#6dd5ed;#667eea;#764ba2"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#6dd5ed">
        <animate
          attributeName="stop-color"
          values="#6dd5ed;#667eea;#764ba2;#6dd5ed"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#gradient)"/>

</svg>
